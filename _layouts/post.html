---
layout: default
---
<article class="post">
  <p class="back"><a href="{{ '/' | relative_url }}">← レポート一覧へ</a></p>
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日 %H:%M" }}（日本時間）</time>
    <h1>{{ page.title }}</h1>
    <p class="ai-note">このレポートは AI（Grok）が自動で作成した要約です。正確な内容は元の投稿をご確認ください。</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>

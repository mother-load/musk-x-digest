<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="notice">練習用サイトです ／ AI（Grok）による自動生成 ／ 非公式</div>

  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">レポート一覧</a>
        <a href="{{ '/about/' | relative_url }}">このサイトについて</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <ul class="disclaimer">
        <li>練習用サイトです。</li>
        <li>レポートは AI（Grok）による自動生成です。内容の正確性は保証しません。</li>
        <li>非公式。イーロン・マスク氏および X Corp. とは一切関係ありません。</li>
      </ul>
      <p class="footer-links"><a href="{{ '/about/' | relative_url }}">このサイトについて・写真の出典</a></p>
    </div>
  </footer>
</body>
</html>
